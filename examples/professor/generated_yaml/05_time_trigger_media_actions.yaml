- alias: Aviso Sonoro - Interruptor Ligado
  description: Avisa no Google Home quando o interruptor for ligado
  triggers:
  - trigger: time
    at: 05:00:00
    weekday:
    - seg
    id: Hora
  conditions: []
  actions:
  - action: media_player.turn_off
    target:
      entity_id:
      - media_player.music_frame_2
      - media_player.music_frame
      - media_player.nestmini0550
    data: {}
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.tx_nr5100
    data:
      volume_level: 0.4
  - action: media_player.play_media
    target:
      entity_id:
      - media_player.tx_nr5100
    data:
      media_content_id: https://example.com/audio.mp3
      media_content_type: audio/mp3
      extra:
        metadata:
          title: Aviso
    metadata:
      source: homi
  - action: tts.speak
    target:
      entity_id:
      - tts.google_ai_tts
    data:
      cache: true
      media_player_entity_id: media_player.cozinha_4
      message: oi oi oi oi oi
  - action: alexa_devices.send_sound
    data:
      sound: amzn_sfx_doorbell_chime_01
      device_id: 3926ef6f709821d794008bb86c52ecd4
  - action: alexa_devices.send_text_command
    data:
      device_id: 38496a203273bbff294d6465d4042e55
      text_command: desligar tela
  mode: single
